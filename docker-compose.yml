services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clouddash
      POSTGRES_USER: clouddash
      POSTGRES_PASSWORD: clouddash_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://clouddash:clouddash_dev@postgres:5432/clouddash?schema=public
      JWT_SECRET: replace-this-before-production
    ports: ["3001:3001"]
    depends_on: [postgres]
volumes:
  postgres_data:
