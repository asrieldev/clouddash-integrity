<!doctype html>

  <head>

    <title>CloudDash Integrity</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .encoder-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.9fr);gap:14px}.encoder-capture{min-height:480px}.camera-stage{height:274px;border-radius:7px;background:#05080f;border:1px solid #263244;position:relative;overflow:hidden;display:grid;place-items:center}.camera-stage.active{background:#233144}.camera-off{display:grid;justify-items:center;gap:8px;color:#7f91ae}.camera-off b{font-size:14px}.camera-off small{font-size:11px;color:#64748b}.camera-road{position:absolute;inset:38% -15% 0;background:#3e4b5e;transform:perspective(180px) rotateX(39deg)}.camera-road i{position:absolute;bottom:0;width:3px;height:90%;background:#eab308}.camera-road i:nth-child(1){left:39%;transform:rotate(12deg)}.camera-road i:nth-child(2){right:38%;transform:rotate(-12deg)}.camera-road i:nth-child(3){left:54%;height:30%;width:100px;background:#182131;border-radius:5px;transform:translateX(-50%)}.rec-dot,.camera-label{position:absolute;padding:5px 7px;background:#0b1220cf;border-radius:4px;font-size:10px;color:#dbeafe}.rec-dot{top:10px;left:10px;color:#fecaca}.rec-dot:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-right:5px}.camera-label{right:10px;bottom:10px;color:#94a3b8}.encoder-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.button.danger{background:#b91c1c;color:#fff}.button.warning{background:#6d4910;border-color:#a16207;color:#fde68a}.button:disabled{opacity:.45;cursor:not-allowed}.encoder-selects{display:grid;grid-template-columns:1fr 1fr;gap:12px}.encoder-selects label{font-size:11px;color:#94a3b8;display:grid;gap:7px}.encoder-selects select{height:34px;color:#cbd5e1;background:#0b1220;border:1px solid #2d3b50;border-radius:5px;padding:0 8px}.encoder-side{display:grid;gap:14px}.encoder-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.encoder-metrics .metric{min-height:88px;padding:14px}.encoder-metrics .metric strong{font-size:18px}.fingerprint{min-height:300px}.fingerprint>svg{color:#60a5fa}.fingerprint dl{margin:0;display:grid;gap:5px}.fingerprint dt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#64748b;margin-top:8px}.fingerprint dd{margin:0;color:#cbd5e1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;word-break:break-all;line-height:1.5}.fingerprint .hash-green{color:#34d399}.fingerprint .hash-blue{color:#38bdf8}.segment-table{margin-top:14px}.storage{font-size:10px;color:#64748b}@media(max-width:1050px){.encoder-grid{grid-template-columns:1fr}.encoder-side{grid-template-columns:1fr 1fr}.fingerprint{min-height:0}}@media(max-width:780px){.encoder-side{grid-template-columns:1fr}.encoder-selects,.encoder-metrics{grid-template-columns:1fr}.camera-stage{height:220px}.encoder-actions .button{flex:1;justify-content:center}.segment-table table{min-width:660px}}
    </style>
  </head>
